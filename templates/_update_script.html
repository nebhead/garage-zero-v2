<script>
$(function() {
	var RESTART_SECS = 25, REBOOT_SECS = 60;
	var busy = false;

	function esc(s) { return $('<div>').text(s).html(); }

	function renderCommits(list) {
		var ul = $('#update-commits').empty();
		if (!list.length) { ul.append('<li class="list-group-item">None</li>'); }
		list.forEach(function(c) {
			ul.append('<li class="list-group-item"><code>' + esc(c.hash) + '</code> ' + esc(c.subject) +
				'<br><span class="text-muted">' + esc(c.author) + ' &middot; ' + esc(c.date) + '</span></li>');
		});
	}

	function applyResult(d) {
		if (!d.ok) {
			$('#update-card-status').text('Unable to check for updates.');
			$('#update-msg').attr('class', 'alert alert-danger py-2').text('Update check failed: ' + d.error);
			$('#btn-update-apply').prop('disabled', true);
			return;
		}
		$('#update-latest').text(d.latest);
		$('#update-plan').hide();
		if (d.available) {
			var txt = d.behind + ' new commit' + (d.behind == 1 ? '' : 's') + ' available (' + d.current + ' → ' + d.latest + ').';
			$('#update-card-status').text('Update available: ' + d.latest);
			$('#update-banner-text').text(txt);
			$('#update-banner').show();
			$('#update-msg').attr('class', 'alert alert-info py-2').text(txt);
			$('#update-commits-title').text('Changes since your version');
			renderCommits(d.pending);
			$('#btn-update-apply').prop('disabled', false);
			if (d.plan) {
				var items = [];
				if (d.plan.requires_pip) items.push('New python modules will be installed.');
				items.push(d.plan.requires_reboot ? 'The system will be <b>rebooted</b> (about 60 s).' : 'Services will be restarted (about 25 s).');
				d.plan.notes.forEach(function(n) { items.push(esc(n)); });
				$('#update-plan').html(items.join('<br>')).show();
			}
		} else {
			$('#update-card-status').text('Up to date (checked ' + d.checked + ').');
			$('#update-banner').hide();
			$('#update-msg').attr('class', 'alert alert-success py-2').text('You are up to date. Last checked ' + d.checked + '.');
			$('#update-commits-title').text('Latest commits');
			renderCommits(d.recent);
			$('#btn-update-apply').prop('disabled', true);
		}
	}

	function check(force) {
		$('#update-msg').attr('class', 'alert alert-secondary py-2').text('Checking...');
		$('#btn-update-check').prop('disabled', true);
		return $.ajax({ url: '/update/check', data: { force: force ? 'true' : 'false' } })
			.done(applyResult)
			.fail(function() { applyResult({ ok: false, error: 'Request failed.' }); })
			.always(function() { $('#btn-update-check').prop('disabled', false); });
	}

	function setBusy(b) {
		busy = b;
		$('#btn-update-close, #update-close-x, #btn-update-check, #btn-update-apply').prop('disabled', b);
	}

	function waitForServer() {
		var box = $('#update-restart');
		var tries = 0;
		(function pingLoop() {
			tries++;
			box.html('<i class="fas fa-spinner fa-spin"></i>&nbsp; Waiting for server to come back online... (attempt ' + tries + ')');
			$.ajax({ url: '/ping', timeout: 3000, cache: false })
				.done(function() {
					box.attr('class', 'alert alert-success py-2').html('<i class="fas fa-check-circle"></i>&nbsp; Server is back online. Reloading...');
					setTimeout(function() { location.reload(); }, 1000);
				})
				.fail(function() { setTimeout(pingLoop, 2000); });
		})();
	}

	function countdown(action) {
		var secs = action == 'reboot' ? REBOOT_SECS : RESTART_SECS;
		var label = action == 'reboot' ? 'Rebooting system' : 'Restarting services';
		var box = $('#update-restart').attr('class', 'alert alert-info py-2').show();
		(function tick() {
			if (secs <= 0) { return waitForServer(); }
			box.html('<i class="fas fa-power-off"></i>&nbsp; ' + label + '. Checking server in <b>' + secs + '</b> s...');
			secs--;
			setTimeout(tick, 1000);
		})();
	}

	function poll(since) {
		$.ajax({ url: '/update/status', data: { since: since }, cache: false, timeout: 10000 })
			.done(function(s) {
				var out = $('#update-output');
				if (s.lines.length) {
					out.append(document.createTextNode(s.lines.join('\n') + '\n'));
					out.scrollTop(out[0].scrollHeight);
				}
				if (s.state == 'running') { return setTimeout(function() { poll(s.next); }, 1000); }
				var bar = $('#update-progress').removeClass('progress-bar-animated progress-bar-striped');
				if (s.state == 'done') {
					bar.addClass('bg-success').text('Update complete');
					countdown(s.action);
				} else {
					bar.addClass('bg-danger').text('Update failed');
					setBusy(false);
					$('#btn-update-apply').prop('disabled', true);
				}
			})
			.fail(function() { setTimeout(function() { poll(since); }, 2000); });
	}

	$('#btn-update-check').click(function() { check(true); });

	$('#btn-update-apply').click(function() {
		setBusy(true);
		$('#update-view-info').hide();
		$('#update-view-progress').show();
		$('#update-output').text('');
		$.ajax({ url: '/update/start', type: 'POST' })
			.done(function() { poll(0); })
			.fail(function(x) {
				var e = (x.responseJSON && x.responseJSON.error) || 'Failed to start update.';
				$('#update-output').text(e + '\n');
				$('#update-progress').attr('class', 'progress-bar bg-danger').text('Update failed');
				setBusy(false);
			});
	});

	// Return to the info view when the modal is reopened after a failed update
	$('#md-update').on('show.bs.modal', function() {
		if (!busy) { $('#update-view-progress').hide(); $('#update-view-info').show(); }
	});

	check(false);
});
</script>
