<!-- Software Update Card -->
<div class="card shadow">
	<div class="card-header bg-info">
		<i class="fas fa-cloud-download-alt"></i>&nbsp; Software Update
	</div>
	<div class="card-body">
		<div class="row align-items-center">
			<div class="col">
				<h4 class="mb-0">Garage<i class="text-primary">Zero</i> <span class="badge bg-primary">{{ app_version }}</span></h4>
				<small class="text-muted" id="update-card-status">Checking for updates...</small>
			</div>
			<div class="col-auto">
				<button type="button" class="btn btn-secondary" id="btn-open-update" data-bs-toggle="modal" data-bs-target="#md-update">
					<i class="fas fa-sync-alt"></i>&nbsp; Updates
				</button>
			</div>
		</div>
	</div>
</div><br>

<!-- Update Modal -->
<div class="modal fade" id="md-update" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true" data-bs-backdrop="static">
	<div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
	<div class="modal-content">
		<div class="modal-header">
			<h5 class="modal-title" id="updateModalLabel"><i class="fas fa-cloud-download-alt"></i>&nbsp; Software Update</h5>
			<button type="button" class="btn-close" id="update-close-x" data-bs-dismiss="modal" aria-label="Close"></button>
		</div>
		<div class="modal-body">
			<!-- Check / commits view -->
			<div id="update-view-info">
				<p>Installed version: <span class="badge bg-primary">{{ app_version }}</span>
				&nbsp; Latest: <span class="badge bg-success" id="update-latest">?</span></p>
				<div id="update-msg" class="alert alert-secondary py-2">Checking...</div>
				<div id="update-plan" class="alert alert-warning py-2" style="display:none"></div>
				<h6 id="update-commits-title">Commits</h6>
				<ul class="list-group list-group-flush small" id="update-commits"></ul>
			</div>
			<!-- Progress view -->
			<div id="update-view-progress" style="display:none">
				<div class="progress mb-3" style="height: 1.25rem;">
					<div class="progress-bar progress-bar-striped progress-bar-animated" id="update-progress" role="progressbar" style="width: 100%">Updating...</div>
				</div>
				<pre class="p-2 border rounded" id="update-output" style="height: 14rem; overflow-y: auto; font-size: 0.8rem; white-space: pre-wrap;"></pre>
				<div id="update-restart" class="alert alert-info py-2" style="display:none"></div>
			</div>
		</div>
		<div class="modal-footer">
			<button type="button" class="btn btn-secondary" id="btn-update-check"><i class="fas fa-sync-alt"></i>&nbsp; Check for Updates</button>
			<button type="button" class="btn btn-success" id="btn-update-apply" disabled><i class="fas fa-download"></i>&nbsp; Update Now</button>
			<button type="button" class="btn btn-outline-secondary" id="btn-update-close" data-bs-dismiss="modal">Close</button>
		</div>
	</div>
	</div>
</div>
